buildscript {
	// BEGIN: For NUODB
	// Set NuoDB JDBC JAR version
	ext.nuodbJdbcJarVersion = "24.2.1";  // Any recent version will do
	println("build.gradle: Using NuoDB JDBC JAR ${nuodbJdbcJarVersion} - edit file to change.")

	// Look for our JARs locally
	repositories {
		mavenCentral()
		mavenLocal()
	}
	// END: For NUODB

	dependencies {
//		classpath 'org.asciidoctor:asciidoctor-gradle-plugin:1.5.7'
		classpath buildscriptLibs.forbiddenapis
		classpath 'org.junit.platform:junit-platform-gradle-plugin:1.0.3'
		classpath "com.nuodb.jdbc:nuodb-jdbc:${nuodbJdbcJarVersion}"  // For NUODB
	}
}


plugins {
	id "local.module"

	id "org.hibernate.build.version-injection" version "2.2.0" apply false
	id 'org.hibernate.orm.database-service' apply false
	id 'biz.aQute.bnd' version '7.1.0' apply false

	id "com.diffplug.spotless" version "7.0.4"
	id 'org.checkerframework' version '0.6.61'
	id 'org.hibernate.orm.build.jdks'

	id 'io.github.gradle-nexus.publish-plugin' version '2.0.0'

	id 'idea'
	id 'org.jetbrains.gradle.plugin.idea-ext' version '1.1.10'
	id 'eclipse'
	id "com.dorongold.task-tree" version "4.0.1"
}

repositories {
	mavenCentral()
	mavenLocal()
}

// ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
// BEGIN: For NUODB


tasks.withType(JavaCompile) {
    options.compilerArgs << ' -Xlint:-all -nowarn'
}

// Tests take about 10 mins to compile and will then fail if the database is
// unavailable or the dialect is wrong.  We do our own checks here to catch
// such errors early. Make sure that 'SimpleDatabaseVersion.groovy' and
// 'CheckNuoDBDatabaseAndVersion.groovy' exist in 'buildSrc/src/main/groovy'.

// >> MAKE SURE THESE ARE VALID FOR THE CURRENT BRANCH
String groovySrcDir = "${project.projectDir}/buildSrc/src/main/groovy";
String databasesGradleFile = 'local-build-plugins/src/main/groovy/local.databases.gradle';

if (!file(groovySrcDir).exists())
	throw new RuntimeException("'${groovySrcDir}' not found - make it exists and copy"
		+ ' SimpleDatabaseVersion.groovy and CheckNuoDBDatabaseAndVersion.groovy into it');

var checker = //
	new CheckNuoDBDatabaseAndVersion(com.nuodb.jdbc.DataSource.class) //
		.validate(nuodbJdbcJarVersion, project, databasesGradleFile);

// Save these away
ext.nuodbHibernateJarVersion = checker.nuodbHibernateJarVersion;
ext.nuodbVersion = checker.nuodbVersion;
ext.nuodbDatabaseVersion = checker.nuodbDatabaseVersion;
// END: For NUODB

// ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
// Releasing

tasks.register( 'releasePrepare' ) {
	group "release-prepare"
	description "Scripted release 'Release Prepare' stage.  " +
			"Includes various checks as to the publish-ability of the project: testing, generation, etc.  " +
			"Sub-projects register their own `releasePrepare` to hook into this stage."
	// See `:release:releasePrepare` which does a lot of heavy lifting here
}

// ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
// CI Build Task

tasks.register('ciBuild') {
	description = "The task performed when one of the 'main' jobs are triggered on the " +
			"CI server.  Just as above, relies on the fact that subprojects will " +
			"appropriately define a release task themselves if they have any tasks " +
			"which should be performed from these CI jobs"
}



// ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
// Misc...

wrapper {
	// To upgrade the version of gradle used in the wrapper, run:
	//     ./gradlew wrapper --gradle-version NEW_VERSION

	// uncomment locally if you need to debug build scripts.
	// in such cases, having the sources helps
	//distributionType = Wrapper.DistributionType.ALL
}


idea {
	module {
		name = "hibernate-orm"
	}
}
