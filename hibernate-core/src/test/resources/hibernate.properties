# This file is a hard coded replacement for the original that uses @xxx@
# placeholders.  Since we only test against NuoDB it's fine for our needs.
# It is used by TestNuoDBDialect and by the Hibernate tests.

# Hibernate's tests use the now deprecated 'Dialect.getDialect()' to get a
# Dialect instance, expecting the 'hibernate.dialect' property to be set,
# ignoring the new dialect resolver. Unfortunately this uses the dialect's
# default constructor so the instance does not know the version of the
# underlying database. 'TestNuoDBDialect' also has a default constructor but
# uses JDBC meta-data to lookup the database version information.
hibernate.dialect com.nuodb.hibernate.TestNuoDBDialect

hibernate.connection.driver_class com.nuodb.hibernate.NuoHibernateDriver
# Force a lock-wait so tests don't run forever
hibernate.connection.url jdbc:com.nuodb.hib://localhost/hibernate_orm_test?jdk14Logger=true&isolation=read_committed&lock-wait-timeout=30
hibernate.connection.username hibernate_orm_test
hibernate.connection.password hibernate_orm_test
#hibernate.connection.schema   DBO

# EXTRA Save URL twice, no idea why the URL property sometimes gets lost, this is a "spare"!
hibernate.connection.url2 jdbc:com.nuodb.hib://localhost/hibernate_orm_test?jdk14Logger=true&isolation=read_committed&lock-wait-timeout=30

# EXTRA: Added the equivalent JPA properties
javax.persistence.jdbc.driver com.nuodb.hibernate.NuoHibernateDriver
javax.persistence.jdbc.url jdbc:com.nuodb.hib://localhost/hibernate_orm_test?jdk14Logger=true&isolation=read_committed&lock-wait-timeout=30
javax.persistence.jdbc.user hibernate_orm_test
javax.persistence.jdbc.password hibernate_orm_test

hibernate.connection.initial_pool_size 16
hibernate.connection.pool_size 16

hibernate.show_sql false
hibernate.format_sql true

hibernate.max_fetch_depth 5

hibernate.cache.region_prefix hibernate.test
hibernate.cache.region.factory_class org.hibernate.testing.cache.CachingRegionFactory

javax.persistence.validation.mode=NONE
hibernate.service.allow_crawling=false
hibernate.session.events.log=true

hibernate.hql.bulk_id_strategy.global_temporary.drop_tables=true
hibernate.connection.isolation=READ_COMMITTED

# DIALECT RESOLUTION ... Enable use of NuoDB Dialect resolver

# Enable use of NuoDB Dialect resolver - do any tests actually use this?
hibernate.dialect_resolvers=com.nuodb.hibernate.NuoDbDialectResolver
hibernate.temp.use_jdbc_metadata_defaults=true
