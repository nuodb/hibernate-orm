# This file is used as-is by the tests copied from 'hibernate-orm/hibernate-core'.
#
# It also provides defaults for all the other tests, however tests derived from
# AbstractHibernateTester get connection properties from the selected database
# properties file, ignoring the jakarta.persistence.jdbc.* properties.

# NOTE: Connection properties in the NuoDB URL
# 1. Reduce lock-wait so tests don't run forever
# 2. Default to read-committed (same as other databases)

# Properties for NuoDB (JPA)
jakarta.persistence.jdbc.driver com.nuodb.hibernate.NuoHibernateDriver
jakarta.persistence.jdbc.url jdbc:com.nuodb.hib://localhost/hibernate_orm_test?isolation=read_committed&lock-wait-timeout=10&schema=DBO
jakarta.persistence.jdbc.user hibernate_orm_test
jakarta.persistence.jdbc.password hibernate_orm_test

# Properties for NuodB (Hibernate) - must be the same as the ones above.
# These are used by DialectContext class which in turn uses Environment.
# Some of the copied tests initialize using these properties.
hibernate.connection.driver_class com.nuodb.hibernate.NuoHibernateDriver
hibernate.connection.url jdbc:com.nuodb.hib://localhost/hibernate_orm_test?isolation=read_committed&lock-wait-timeout=10&schema=DBO
hibernate.connection.username hibernate_orm_test
hibernate.connection.password hibernate_orm_test
#hibernate.dialect com.nuodb.hibernate.NuoDBDialect

# Properties for Oracle
#jakarta.persistence.jdbc.driver oracle.jdbc.OracleDriver
#jakarta.persistence.jdbc.url jdbc:oracle:thin:@//localhost:32769/FREE
#jakarta.persistence.jdbc.user hibernate_orm_test
#jakarta.persistence.jdbc.password hibernate_orm_test
#hibernate.dialect com.nuodb.hibernate.LoggingOracleDialect

jakarta.persistence.lock.timeout 30000
jakarta.persistence.query.timeout 50000
jakarta.persistence.validation.mode NONE

# Other Hibernate properties

hibernate.dummy=com.nuodb.common.DUMMY

# Show an/or format SQL?  Can also highlight syntax in different colors
hibernate.show_sql false
hibernate.format_sql true
hibernate.highlight_sql true

# This must be non-null for jakartaSchemaToolingTests to run OK
#hibernate.connection.init_sql drop table if exists t_nuo_person; create table t_nuo_person(id bigint, name string);
hibernate.connection.pool_size 5
hibernate.connection.isolation=READ_COMMITTED
hibernate.connection.schema DBO

hibernate.max_fetch_depth 5

# Test cache, not to be used in production
hibernate.cache.region_prefix hibernate.test
#hibernate.cache.region.factory_class org.hibernate.testing.cache.CachingRegionFactory

# Crawl all available service bindings for an alternate registration of a given Hibernate Service.
# Whatever that does, we are disabling it anyway.
hibernate.service.allow_crawling=false
hibernate.session.events.log=true

# OLD PROPERTIES
# hibernate.hql.bulk_id_strategy.global_temporary.drop_tables=true
hibernate.query.mutation_strategy.global_temporary.drop_tables=true

# Reduce lock time out to 10s from default 2 mins
hibernate.pooling.idleTimeout=10000

# ... Not convinced these do anything useful
#jakarta.persistence.lock.timeout=40
#jakarta.persistence.query.timeout=50

# DIALECT RESOLUTION ...

# Enable use of NuoDB Dialect resolver
hibernate.dialect_resolvers=com.nuodb.hibernate.NuoDBDialectResolver
hibernate.boot.allow_jdbc_metadata_access=true

# ... OR ...

# Disable use of JDBC database metadata
#hibernate.boot.allow_jdbc_metadata_access=false

# Then explicitly specify database and version instead
#jakarta.persistence.database-product-name=NuoDB
#jakarta.persistence.database-major-version=5
#jakarta.persistence.database-minor-version=0


