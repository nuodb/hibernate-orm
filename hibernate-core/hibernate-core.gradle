		    excludeTestsMatching 'org.hibernate.orm.test.query.hql.CaseStatementTest.testSearchedCaseStatementWithAllParamResults'
        } else {
            println "hibernate-core.gradle: Running tests needing HELPER_TYPE column"
        }

