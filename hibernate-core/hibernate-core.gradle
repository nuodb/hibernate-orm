            excludeTestsMatching 'org.hibernate.orm.test.query.SubQueryInFromOneToManyIdClassTests.testEntityJoin'

            excludeTestsMatching 'org.hibernate.orm.test.query.SubQueryInFromOneToManyTests.testEntity'
            excludeTestsMatching 'org.hibernate.orm.test.query.SubQueryInFromOneToManyTests.testEntityImplicit'
            excludeTestsMatching 'org.hibernate.orm.test.query.SubQueryInFromOneToManyTests.testEntityJoin'

            excludeTestsMatching 'org.hibernate.orm.test.query.SubQueryInFromTests.testBasic'
            excludeTestsMatching 'org.hibernate.orm.test.query.SubQueryInFromTests.testEmbedded'
            excludeTestsMatching 'org.hibernate.orm.test.query.SubQueryInFromTests.testEntity'
            excludeTestsMatching 'org.hibernate.orm.test.query.SubQueryInFromTests.testEntityImplicit'
            excludeTestsMatching 'org.hibernate.orm.test.query.SubQueryInFromTests.testEntityJoin'

            // CASE ... IN (...) weirdness
            excludeTestsMatching 'org.hibernate.orm.test.hql.HQLTest.test_hql_in_predicate_example_1'
            excludeTestsMatching 'org.hibernate.orm.test.jpa.ql.TreatKeywordTest.testFilteringJoinedSubclasses'
        } else {
            println "hibernate-core.gradle: Running tests using NuoDB 7 features"
        }

        if (nuodbDatabaseVersion.isBefore(7,0,2)) {
            println "hibernate-core.gradle: Excluding tests needing HELPER_TYPE column"

            // JIRA DB-40465: Can't create table with HELPER_TYPE column. FIXED in 7.0.2
            excludeTestsMatching 'org.hibernate.orm.test.jpa.criteria.idclass.IdClassPredicateTest.testCountIdClassAttributes'
            excludeTestsMatching 'org.hibernate.orm.test.jpa.criteria.idclass.IdClassPredicateTest.testDeclaredIdClassAttributes'
            excludeTestsMatching 'org.hibernate.orm.test.jpa.criteria.idclass.IdClassPredicateTest.testSupertypeIdClassAttributes'

