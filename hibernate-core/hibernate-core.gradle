            excludeTestsMatching 'org.hibernate.orm.test.jpa.query.CorrelationCteDerivedRootTest.tesDerivedRoot'
		    excludeTestsMatching 'org.hibernate.orm.test.query.hql.InsertSelectTests.testInsertSelectDistinct'

            // INTERSECT and EXCEPT 
		    excludeTestsMatching 'org.hibernate.orm.test.bootstrap.binding.annotations.embedded.EmbeddedTest.testQueryWithEmbeddedParameterAllNull'
		    excludeTestsMatching 'org.hibernate.orm.test.bootstrap.binding.annotations.embedded.EmbeddedTest.testQueryWithEmbeddedParameterOneNull'
		    excludeTestsMatching 'org.hibernate.orm.test.hql.HQLTest.test_hql_derived_join_example'

		    excludeTestsMatching 'org.hibernate.orm.test.jpa.criteria.CriteriaQualifiedJoinTest.testJoinLateral'

            excludeTestsMatching 'org.hibernate.orm.test.query.SubQueryInFromEmbeddedIdTests.testEntity'
            excludeTestsMatching 'org.hibernate.orm.test.query.SubQueryInFromEmbeddedIdTests.testEntityImplicit'
            excludeTestsMatching 'org.hibernate.orm.test.query.SubQueryInFromEmbeddedIdTests.testEntityJoin'

            excludeTestsMatching 'org.hibernate.orm.test.query.SubQueryInFromIdClassTests.testEntity'
            excludeTestsMatching 'org.hibernate.orm.test.query.SubQueryInFromIdClassTests.testEntityImplicit'
            excludeTestsMatching 'org.hibernate.orm.test.query.SubQueryInFromIdClassTests.testEntityJoin'

            excludeTestsMatching 'org.hibernate.orm.test.query.SubQueryInFromInverseOneEmbeddedIdTests.testEntity'
            excludeTestsMatching 'org.hibernate.orm.test.query.SubQueryInFromInverseOneEmbeddedIdTests.testEntityImplicit'
            excludeTestsMatching 'org.hibernate.orm.test.query.SubQueryInFromInverseOneEmbeddedIdTests.testEntityJoin'

            excludeTestsMatching 'org.hibernate.orm.test.query.SubQueryInFromInverseOneIdClassTests.testEntity'
            excludeTestsMatching 'org.hibernate.orm.test.query.SubQueryInFromInverseOneIdClassTests.testEntityImplicit'
            excludeTestsMatching 'org.hibernate.orm.test.query.SubQueryInFromInverseOneIdClassTests.testEntityJoin'

            excludeTestsMatching 'org.hibernate.orm.test.query.SubQueryInFromInverseOneTests.testEntity'
            excludeTestsMatching 'org.hibernate.orm.test.query.SubQueryInFromInverseOneTests.testEntityImplicit'
            excludeTestsMatching 'org.hibernate.orm.test.query.SubQueryInFromInverseOneTests.testEntityJoin'

            excludeTestsMatching 'org.hibernate.orm.test.query.SubQueryInFromManyToManyEmbeddedIdTests.testEntity'
            excludeTestsMatching 'org.hibernate.orm.test.query.SubQueryInFromManyToManyEmbeddedIdTests.testEntityImplicit'
            excludeTestsMatching 'org.hibernate.orm.test.query.SubQueryInFromManyToManyEmbeddedIdTests.testEntityJoin'

            excludeTestsMatching 'org.hibernate.orm.test.query.SubQueryInFromManyToManyIdClassTests.testEntity'
            excludeTestsMatching 'org.hibernate.orm.test.query.SubQueryInFromManyToManyIdClassTests.testEntityImplicit'
            excludeTestsMatching 'org.hibernate.orm.test.query.SubQueryInFromManyToManyIdClassTests.testEntityJoin'

            excludeTestsMatching 'org.hibernate.orm.test.query.SubQueryInFromManyToManyTests.testEntity'
            excludeTestsMatching 'org.hibernate.orm.test.query.SubQueryInFromManyToManyTests.testEntityImplicit'
            excludeTestsMatching 'org.hibernate.orm.test.query.SubQueryInFromManyToManyTests.testEntityJoin'

            excludeTestsMatching 'org.hibernate.orm.test.query.SubQueryInFromOneToManyEmbeddedIdTests.testEntity'
            excludeTestsMatching 'org.hibernate.orm.test.query.SubQueryInFromOneToManyEmbeddedIdTests.testEntityImplicit'
