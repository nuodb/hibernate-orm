		excludeTestsMatching 'org.hibernate.orm.test.query.criteria.InsertSelectTests.simpleTest'

        // Table and column names must be unique. Even if quoted, "Table1" and "TABLE1" are considered the same.
        excludeTestsMatching 'org.hibernate.orm.test.schemaupdate.SchemaUpdateTest'

        // TIMESTAMP precision is always 6 (MICROSECONDS)
        excludeTestsMatching 'org.hibernate.orm.test.temporal.FractionalSecondsTests.testUsage0'  // Expects precision(0)
        excludeTestsMatching 'org.hibernate.orm.test.temporal.FractionalSecondsTests.testUsage3'  // Expects precision(3)
