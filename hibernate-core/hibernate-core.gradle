import org.apache.tools.ant.filters.ReplaceTokens

plugins {
    id "local.publishing-java-module"
    id "local.publishing-group-relocation"

    id "org.hibernate.build.version-injection"
    id "org.hibernate.orm.antlr"
    id "local-xjc-plugin"
}

description = 'Hibernate\'s core ORM functionality'

configurations {
    tests {
        description = 'Configuration for the produced test jar'
    }
}

// BEGIN: For NUODB - search local repo also
repositories {
	mavenCentral()
    mavenLocal()
}

// Does the NuoDB JDBC JAR support NClob, NString ... ?
if (nuodbJdbcJarVersion.toString().compareTo("24.2.2") < 0)
    println("Skipping NClob tests - wrong NuoDB JDBC JAR version: ${nuodbJdbcJarVersion}");
else
    println("Skipping NClob tests - compliant NuoDB JDBC JAR version: ${nuodbJdbcJarVersion}");

println "Building Hibernate Version ${version}, testing against ${db}"

// --------------------------------------------------------------------- //
// -          Control which tests are included or excluded 6.6         - //
// --------------------------------------------------------------------- //

test {
    filter {
        // ----------------------------------------------------------------------------
        // Tests modified for NuoDB differences allowing most of a test method to run,
        // rather than skipping the whole thing.
        // ----------------------------------------------------------------------------
        // org.hibernate.orm.test.batch.BatchOptimisticLockingTest - Shorter message in (expected) exception
        // org.hibernate.orm.test.boot.database.metadata.MetadataAccessTests - Modify to only test with NuoDB
        // org.hibernate.orm.test.dialect.resolver.DialectFactoryTest  - add our Dialect
        // org.hibernate.orm.test.jpa.criteria.basic.ExpressionsTest - skip comparison of TIME intervals
        // org.hibernate.orm.test.jpa.metadata.TypesafeNamedQueryTest.java - added a 1s delay so timeStamps differ
        // org.hibernate.orm.test.query.hql.FunctionTests = Skips queries using ln(), log(), log10(), extract(WEEK ...)
        // org.hibernate.orm.test.query.hql.StandardFunctionTests - ignore ln(), extract(WEEK ...)
        // org.hibernate.orm.test.query.QueryTimeOutTest - add our dialect (we use same syntax as Oracle)
        // org.hibernate.orm.test.stateless.StatelessSessionStatisticsTest - NuoDB uses 4 prep stmts (like sybase and mysql) not 3

        // ---------------------------------------------------------------------
        // Failing tests that need fixing?
        // ---------------------------------------------------------------------

        // NuoDB has a slightly different error message
        // org.hibernate.orm.test.batch.BatchOptimisticLockingTest.testBatchAndOptimisticLocking

        // Contrived LIKE patterns fail (3 tests)
        excludeTestsMatching 'org.hibernate.orm.test.query.hql.LikeEscapeDefaultTest'

        // Works when run on its own
        excludeTestsMatching 'org.hibernate.orm.test.query.hql.FunctionTests.testAggregateIndexElementWithPath'
        excludeTestsMatching 'org.hibernate.orm.test.query.hql.FunctionTests.testDurationArithmetic'
        excludeTestsMatching 'org.hibernate.orm.test.query.hql.FunctionTests.testDurationArithmeticWithParameters'
        excludeTestsMatching 'org.hibernate.orm.test.query.hql.FunctionTests.testFormat'
        excludeTestsMatching 'org.hibernate.orm.test.query.hql.FunctionTests.testFormatTime'
        excludeTestsMatching 'org.hibernate.orm.test.query.hql.FunctionTests.testImplicitCollectionJoinInSelect'
        excludeTestsMatching 'org.hibernate.orm.test.hql.BulkManipulationTest.testInsertWithManyToOne' // Undefined reference to DESCRIPTION
        excludeTestsMatching 'org.hibernate.orm.test.hql.BulkManipulationTest.testInsertWithSelectListUsingJoins'

        excludeTestsMatching 'org.hibernate.orm.test.stateless.StatelessSessionMultipleOpsSubsequentBatchTest.testDeleteMultipleSubsequentBatch'
        excludeTestsMatching 'org.hibernate.orm.test.stateless.StatelessSessionMultipleOpsSubsequentBatchTest.testInsertMultipleSubsequentBatch'
        excludeTestsMatching 'org.hibernate.orm.test.stateless.StatelessSessionMultipleOpsSubsequentBatchTest.testUpdateMultipleSubsequentBatch' 

        // WARNING: Failing tests from this class leak connections and exhaust the pool, so all subsequent tests fail
        excludeTestsMatching 'org.hibernate.orm.test.hql.ASTParserLoadingTest.testEJBQLFunctions' // Cannot compare INTEGER to OBJECT?

        // undefined reference to "V1_0"."NAME", presumably because 'v1_'0' is only valid within the join in brackets
        // select  li1_0.id, li1_0.order_id, li1_0.product_id, li1_0.quantity, li1_0.subTotal  from  LineItem li1_0
        //     join (Product p1_0 join Vendor v1_0 on v1_0.id=p1_0.vendor_id) 
        //        on p1_0.id=li1_0.product_id , /* CROSS JOIN */ orders o1_0 join ASSOCIATE sa1_0 
        //        on sa1_0.id=o1_0.associate_id  and v1_0.name=sa1_0.familyName;
        excludeTestsMatching 'org.hibernate.orm.test.query.hql.JpaCrossJoinBaselineTests.testCrossJoin'

        // Timezones and timestamps. Several of these fail even though expected and actual match
        excludeTestsMatching 'org.hibernate.orm.test.type.temporal.LocalDateTest.nativeWriteThenRead'
        excludeTestsMatching 'org.hibernate.orm.test.type.temporal.LocalDateTest.writeThenNativeRead'
        excludeTestsMatching 'org.hibernate.orm.test.type.temporal.LocalDateTest.writeThenRead'
   
        // Timezone not picked up from Hibernate
        excludeTestsMatching 'org.hibernate.orm.test.timestamp.JdbcTimeCustomTimeZoneTest.testTimeZone'
        excludeTestsMatching 'org.hibernate.orm.test.timestamp.JdbcTimestampCustomSessionLevelTimeZoneTest.testTimeZone'
        excludeTestsMatching 'org.hibernate.orm.test.timestamp.JdbcTimestampCustomTimeZoneTest.testTimeZone'

        // Can't convert LocalDate, LocalTime, LocalDateTime to column type
