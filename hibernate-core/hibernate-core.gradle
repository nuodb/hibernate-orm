		excludeTestsMatching 'org.hibernate.orm.test.query.criteria.CriteriaWindowFunctionTest.testReusableWindow'
		excludeTestsMatching 'org.hibernate.orm.test.query.criteria.CriteriaWindowFunctionTest.testNthValue'
        excludeTestsMatching 'org.hibernate.orm.test.query.hql.WindowFunctionTest.testFrame'

